services:
  postgres:
    image: postgres:16-alpine
    container_name: qrattendance-client-postgres
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 128m
    cpu_shares: 512
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=30
      - -c
      - effective_cache_size=256MB
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - qrattendance_client_postgres_data:/var/lib/postgresql/data

volumes:
  qrattendance_client_postgres_data:
