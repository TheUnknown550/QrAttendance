services:
  postgres:
    image: postgres:16-alpine
    container_name: qrattendance-client-postgres
    restart: unless-stopped
    mem_limit: 1024m
    mem_reservation: 256m
    cpu_shares: 1024
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=60
      - -c
      - effective_cache_size=512MB
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - qrattendance_client_postgres_data:/var/lib/postgresql/data

volumes:
  qrattendance_client_postgres_data:
